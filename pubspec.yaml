name: psychic_heroes_mobile
description: "PsychicHeroes mobile application for iOS and Android built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.1
  
  # Network & API
  http: ^1.2.0
  web_socket_channel: '>=2.4.0 <4.0.0'
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Utilities & UI
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

